version: '3.8'

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: n8npass
      POSTGRES_DB: n8ndb
    volumes:
      - ~/postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  n8n:
    image: carlosov/n8n-ffmpeg:0.0.7-n8n-2
    ports:
      - "5678:5678"
      - "443:443"
      - "80:80"
    env_file:
      - .env
    volumes:
      - ~/.n8n:/home/node
      - ~/letsencrypt:/etc/letsencrypt 
    depends_on:
      - postgres
    restart: unless-stopped