version: '3.8'

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: n8npass
      POSTGRES_DB: n8ndb
    volumes:
      - ~/postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  n8n:
    image: carlosov/n8n-ffmpeg:0.0.8-n8n-2
    ports:
      - "5678:5678"
      - "443:443"
      - "80:80"
    env_file:
      - .env
    volumes:
      - ~/.n8n:/home/node
      - ~/letsencrypt:/etc/letsencrypt 
    depends_on:
      - postgres
    restart: unless-stopped

  nocodb:
    image: nocodb/nocodb:latest
    container_name: noco
    ports:
      - "8080:8080"
    environment:
      NC_DB: "pg://postgres:5432?u=n8n&p=n8npass&d=nocodb"
      NC_AUTH_JWT_SECRET: "573c5a4b-95f1-483b-bb14-02bc73b5cea6"
    volumes:
      - ~/nocodb:/usr/app/data/
    depends_on:
      - postgres
    restart: unless-stopped